<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Neon Survivors - Ultimate</title>
<meta name="theme-color" content="#1e1e24">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; touch-action: none; user-select: none; background: #1e1e24; font-family: 'Segoe UI', sans-serif; color: #e0e0e0; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #hud { position: absolute; top: 0; left: 0; width: 100%; padding: 15px; pointer-events: none; display: flex; flex-direction: column; gap: 5px; z-index: 2; }
  .bar-container { width: 100%; max-width: 300px; height: 15px; background: rgba(0,0,0,0.6); border: 2px solid #6b7280; border-radius: 8px; overflow: hidden; }
  #hp-bar { height: 100%; background: #d16ba5; width: 100%; transition: width 0.1s; }
  #hp-bar-p2 { height: 100%; background: #f4a261; width: 100%; transition: width 0.1s; }
  #xp-bar { height: 100%; background: #4cc9f0; width: 0%; transition: width 0.1s; }
  #timer { position: absolute; top: 15px; right: 15px; font-size: 24px; font-weight: bold; font-family: monospace; color: #fff; z-index: 2; }
  #coin-hud { position: absolute; top: 45px; right: 15px; font-size: 16px; font-weight: bold; color: #f4a261; z-index: 2; }
  #home-btn { position: absolute; top: 75px; right: 15px; background: #2b2b36; border: 2px solid #a0a0a0; color: #fff; padding: 8px 12px; font-size: 14px; font-weight: bold; border-radius: 8px; cursor: pointer; z-index: 15; display: none; }
  body.playing #home-btn { display: block; }
  
  #omnitrix-btn { position: absolute; bottom: 220px; right: 20px; width: 70px; height: 70px; border-radius: 50%; background: #00ff00; border: 4px solid #fff; color: #000; font-size: 12px; font-weight: bold; cursor: pointer; z-index: 25; display: none; align-items: center; justify-content: center; box-shadow: 0 0 20px #00ff00; animation: pulse 1s infinite alternate; }
  #shield-btn { position: absolute; bottom: 220px; left: 20px; width: 70px; height: 70px; border-radius: 50%; background: #ffd700; border: 4px solid #fff; color: #000; font-size: 24px; font-weight: bold; cursor: pointer; z-index: 25; display: none; align-items: center; justify-content: center; box-shadow: 0 0 20px #ffd700; animation: pulse 1s infinite alternate; }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.05); } }

  #inventory-container { position: absolute; top: 100px; left: 15px; display: flex; flex-direction: column; gap: 8px; z-index: 2; }
  .inv-row { display: flex; flex-direction: row; gap: 5px; flex-wrap: wrap; max-width: 300px; }
  .inv-icon { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; background: #2b2b36; border: 2px solid #555; color: #fff; position: relative; }
  
  #p1-joystick-zone { position: absolute; bottom: 0; left: 0; width: 50%; height: 60%; display: none; z-index: 5; }
  #p1-base { position: absolute; width: 100px; height: 100px; background: rgba(76, 201, 240, 0.15); border: 2px solid rgba(76, 201, 240, 0.6); border-radius: 50%; display: none; transform: translate(-50%, -50%); }
  #p1-stick { position: absolute; width: 50px; height: 50px; background: rgba(76, 201, 240, 0.7); border-radius: 50%; display: none; transform: translate(-50%, -50%); }
  #p2-joystick-zone { position: absolute; bottom: 0; right: 0; width: 50%; height: 60%; display: none; z-index: 5; }
  #p2-base { position: absolute; width: 100px; height: 100px; background: rgba(244, 162, 97, 0.15); border: 2px solid rgba(244, 162, 97, 0.6); border-radius: 50%; display: none; transform: translate(-50%, -50%); }
  #p2-stick { position: absolute; width: 50px; height: 50px; background: rgba(244, 162, 97, 0.7); border-radius: 50%; display: none; transform: translate(-50%, -50%); }
  #dash-btn-p1 { position: absolute; bottom: 150px; left: 20px; width: 60px; height: 60px; border-radius: 50%; background: rgba(76, 201, 240, 0.3); border: 3px solid #4cc9f0; color: #4cc9f0; font-size: 10px; font-weight: bold; display: none; align-items: center; justify-content: center; z-index: 15; }
  #dash-btn-p2 { position: absolute; bottom: 150px; right: 20px; width: 60px; height: 60px; border-radius: 50%; background: rgba(244, 162, 97, 0.3); border: 3px solid #f4a261; color: #f4a261; font-size: 10px; font-weight: bold; display: none; align-items: center; justify-content: center; z-index: 15; }
  
  body.touch-device.playing.mode-1 #p1-joystick-zone, body.touch-device.playing.mode-1 #dash-btn-p1 { display: block; }
  body.touch-device.playing.mode-2 #p1-joystick-zone, body.touch-device.playing.mode-2 #dash-btn-p1 { display: block; }
  body.touch-device.playing.mode-2 #p2-joystick-zone, body.touch-device.playing.mode-2 #dash-btn-p2 { display: block; }
  body.touch-device.playing.mode-2 #dash-btn-p1 { bottom: 20px; left: 100px; } 
  body.touch-device.playing.mode-2 #dash-btn-p2 { bottom: 20px; right: 100px; } 

  #vignette { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 80px rgba(231, 111, 81, 0); transition: box-shadow 0.2s; z-index: 1; }
  .overlay { position: absolute; inset: 0; background: rgba(30, 30, 36, 0.98); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 20; overflow-y: auto; padding: 20px; }
  .overlay.show { display: flex; }
  h2 { color: #4cc9f0; margin-bottom: 20px; font-size: 32px; text-align: center; }
  
  .char-select { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; max-width: 1100px; }
  .char-box { width: 110px; height: 155px; background: #2b2b36; border: 2px solid #6b7280; border-radius: 10px; display: flex; flex-direction: column; align-items: center; padding-top: 8px; cursor: pointer; position: relative; }
  .char-box.selected-p1 { border: 4px solid #4cc9f0; background: #353542; }
  .char-box.selected-p2 { border: 4px solid #f4a261; background: #353542; }
  .char-label { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: #1e1e24; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: bold; border: 1px solid #555; }
  .char-emoji { font-size: 34px; line-height: 1; margin-bottom: 6px; margin-top: 4px; }
  .char-name { font-weight: bold; font-size: 12px; margin-bottom: 4px; text-align: center; }
  .char-desc { font-size: 9px; color: #a0a0a0; text-align: center; padding: 0 4px; }
  
  .btn { background: #2b2b36; border: 2px solid #4cc9f0; color: #4cc9f0; padding: 10px 20px; font-size: 16px; cursor: pointer; border-radius: 8px; font-weight: bold; margin: 5px; }
  .btn.active { background: #4cc9f0; color: #1e1e24; }
  .btn.gold { border-color: #f4a261; color: #f4a261; }
  .btn.gold.active { background: #f4a261; color: #1e1e24; }
  .btn.red { border-color: #e76f51; color: #e76f51; }
  .btn.pink { border-color: #ff66c4; color: #ff66c4; }
  .btn.pink.active { background: #ff66c4; color: #1e1e24; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn.big { font-size: 22px; padding: 15px 30px; margin-top: 20px; width: 100%; max-width: 400px; }
  
  .upgrades { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; padding: 10px; }
  .upgrade-card { width: 220px; background: #2b2b36; border: 2px solid #6b7280; border-radius: 10px; padding: 15px; text-align: center; cursor: pointer; }
  .upgrade-card:hover { background: #353542; border-color: #4cc9f0; }
  .upgrade-card h3 { color: #e0e0e0; margin-bottom: 10px; font-size: 16px; }
  .upgrade-card p { font-size: 13px; color: #a0a0a0; }
  .upgrade-card.evo { border-color: #f4a261; background: #352b2b; }
  .upgrade-card.evo h3 { color: #f4a261; }
  .action-bar { display: flex; gap: 10px; margin-top: 15px; }
  
  @media (max-width: 800px) {
    .char-box { width: 45%; height: 135px; }
    .char-emoji { font-size: 28px; }
    .upgrade-card { width: 140px; padding: 10px; }
    #dash-btn-p1, #dash-btn-p2 { width: 50px; height: 50px; }
    #omnitrix-btn, #shield-btn { width: 60px; height: 60px; font-size: 10px; bottom: 180px; }
    #shield-btn { font-size: 20px; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="bar-container"><div id="hp-bar"></div></div>
  <div class="bar-container" id="p2-hp-container" style="display:none;"><div id="hp-bar-p2"></div></div>
  <div class="bar-container" style="height: 8px;"><div id="xp-bar"></div></div>
</div>
<div id="coin-hud">🪙 <span id="coin-text">0</span></div>
<div id="timer">00:00</div>
<button id="home-btn" onclick="quitToHome()">🏠 HOME</button>
<div id="inventory-container">
  <div class="inv-row" id="inventory-p1"></div>
  <div class="inv-row" id="inventory-p2" style="display:none;"></div>
</div>
<div id="vignette"></div>
<div id="dash-btn-p1">DASH</div>
<div id="dash-btn-p2">DASH</div>
<button id="omnitrix-btn" onclick="cycleOmnitrix(1)">TRASFORMA</button>
<button id="shield-btn" onclick="toggleShield(1)">🛡️</button>

<div id="start-screen" class="overlay show">
  <h2>NEON SURVIVORS</h2>
  <p style="color: #f4a261; margin-bottom: 10px;">🏆 Record: <span id="record-text">0</span> sec | 🪙 Monete: <span id="coin-total">0</span></p>
  
  <div style="margin-bottom: 10px; text-align: center;">
    <button class="btn active" onclick="setMode(1)" id="btn-1p">👤 1 Giocatore</button>
    <button class="btn" onclick="setMode(2)" id="btn-2p">👥 2 Giocatori</button>
  </div>
  <div style="margin-bottom: 20px; text-align: center;">
    <button class="btn active" onclick="setGameMode('endless')" id="btn-endless">🌊 Sopravvivenza</button>
    <button class="btn pink" onclick="setGameMode('tower')" id="btn-tower">🏰 Torre Infinita</button>
  </div>
  <div style="margin-bottom: 20px; text-align: center;">
    <p style="margin-bottom: 5px; color: #a0a0a0;">Difficoltà</p>
    <button class="btn diff-btn" onclick="setDifficulty('easy', this)">Facile</button>
    <button class="btn diff-btn active" onclick="setDifficulty('normal', this)">Normale</button>
    <button class="btn diff-btn" onclick="setDifficulty('hard', this)">Difficile</button>
    <button class="btn diff-btn" onclick="setDifficulty('extreme', this)">Estremo</button>
  </div>

  <p style="margin-bottom: 10px; color: #a0a0a0;" id="char-select-title">Scegli il Giocatore 1</p>
  <div id="player-select-toggle" style="display:none; margin-bottom: 10px; text-align: center;">
    <button class="btn" id="sel-p1-btn" onclick="setSelectingPlayer(1)">P1</button>
    <button class="btn" id="sel-p2-btn" onclick="setSelectingPlayer(2)">P2</button>
  </div>
  <div class="char-select" id="char-select"></div>
  <div style="margin-bottom: 20px; text-align: center;">
    <p style="margin-bottom: 5px; color: #a0a0a0;">Velocità di Gioco</p>
    <button class="btn" onclick="selectSpeed(1.0, this)">Normale</button>
    <button class="btn active" onclick="selectSpeed(1.3, this)">Veloce</button>
    <button class="btn" onclick="selectSpeed(1.6, this)">Turbo</button>
  </div>
  <div class="action-bar">
    <button class="btn gold" onclick="toggleShop()" id="shop-btn">🛒 NEGOZIO</button>
    <button class="btn" onclick="startGame()">INIZIA PARTITA</button>
  </div>
</div>

<div id="shop-screen" class="overlay">
  <h2>NEGOZIO</h2>
  <p style="margin-bottom: 20px;">Monete: 🪙 <span id="shop-coin-total">0</span></p>
  <div style="display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 500px;">
    <div style="background: #2b2b36; padding: 15px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center;">
      <div><h3 style="color:#4cc9f0;">Vita Massima +</h3><p style="font-size: 14px; color: #a0a0a0;">+20 HP (Lv: <span id="lvl-hp">0</span>)</p></div>
      <button class="btn" onclick="buyUpgrade('hp')" id="buy-hp">Costo: 100</button>
    </div>
    <div style="background: #2b2b36; padding: 15px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center;">
      <div><h3 style="color:#4cc9f0;">Velocità +</h3><p style="font-size: 14px; color: #a0a0a0;">+5% Velocità (Lv: <span id="lvl-spd">0</span>)</p></div>
      <button class="btn" onclick="buyUpgrade('spd')" id="buy-spd">Costo: 150</button>
    </div>
  </div>
  <button class="btn" onclick="toggleShop()" style="margin-top: 30px;">TORNA INDIETRO</button>
</div>

<div id="levelup" class="overlay">
  <h2>LEVEL UP!</h2>
  <div class="upgrades" id="upgrade-options"></div>
  <div class="action-bar">
    <button class="btn gold" onclick="rerollChoices('levelup')" id="btn-reroll">REROLL</button>
    <button class="btn red" onclick="banishChoice('levelup')" id="btn-banish">BANISH</button>
  </div>
</div>

<div id="chest-screen" class="overlay">
  <h2 style="color: #f4a261;">🎁 BAULE!</h2>
  <div class="upgrades" id="chest-options"></div>
  <div class="action-bar">
    <button class="btn gold" onclick="rerollChoices('chest-screen')" id="btn-reroll-chest">REROLL</button>
    <button class="btn red" onclick="banishChoice('chest-screen')" id="btn-banish-chest">BANISH</button>
  </div>
</div>

<div id="pause-screen" class="overlay">
  <h2>PAUSA</h2>
  <div id="pause-stats" style="text-align: left; background: #2b2b36; padding: 20px; border-radius: 10px; font-family: monospace;"></div>
  <button class="btn" onclick="togglePause()" style="margin-top: 20px;">RIPRENDI</button>
</div>

<div id="gameover-screen" class="overlay">
  <h2 style="color: #e76f51;">GAME OVER!</h2>
  <div style="background: #2b2b36; padding: 20px; border-radius: 10px; margin: 20px 0; text-align: center; font-size: 20px; width: 100%; max-width: 400px;">
    <p>🏆 Tempo: <b id="go-time">0</b>s</p>
    <p>🪙 Monete guadagnate: <b id="go-coins">0</b></p>
  </div>
  <button class="btn big" onclick="returnToHome()">TORNA ALLA HOME</button>
</div>

<div id="p1-joystick-zone"><div id="p1-base"></div><div id="p1-stick"></div></div>
<div id="p2-joystick-zone"><div id="p2-base"></div><div id="p2-stick"></div></div>

<script>
const safeStorage = { getItem: function(k) { try { return localStorage.getItem(k); } catch(e) { return null; } }, setItem: function(k, v) { try { localStorage.setItem(k, v); } catch(e) {} } };
const isTouchDevice = ('ontouchstart' in window || navigator.maxTouchPoints > 0);
if (isTouchDevice) document.body.classList.add('touch-device');
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false }); 
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();

const emojiCache = {};
function drawEmoji(g, emoji, cx, cy, targetSize) {
  const key = emoji + 64;
  if (!emojiCache[key]) {
    const c = document.createElement('canvas'); const x = c.getContext('2d');
    c.width = 96; c.height = 96;
    x.font = `64px Arial, sans-serif`; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText(emoji, 48, 48); emojiCache[key] = c;
  }
  g.drawImage(emojiCache[key], Math.round(cx - targetSize/2), Math.round(cy - targetSize/2), Math.round(targetSize), Math.round(targetSize));
}

let audioCtx = null;
try { const AC = window.AudioContext || window.webkitAudioContext; if (AC) audioCtx = new AC(); } catch(e) {}
function playSound(freq, type, dur, vol, slide=0) {
  if (!audioCtx || audioCtx.state === 'suspended') { if(audioCtx) audioCtx.resume(); return; }
  try {
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    if(slide) osc.frequency.exponentialRampToValueAtTime(freq + slide, audioCtx.currentTime + dur);
    gain.gain.setValueAtTime(vol * 0.7, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
  } catch(e){}
}

// FIX: Inizializzazione sicura del salvataggio per evitare crash da vecchi dati
let metaStr = safeStorage.getItem('neon_meta');
let meta = metaStr ? JSON.parse(metaStr) : {};
meta.coins = meta.coins || 0;
meta.hpLvl = meta.hpLvl || 0;
meta.spdLvl = meta.spdLvl || 0;
meta.rerolls = meta.rerolls || 0;

function saveMeta() { safeStorage.setItem('neon_meta', JSON.stringify(meta)); updateCoinUI(); }
function updateCoinUI() {
  document.getElementById('coin-text').textContent = meta.coins;
  document.getElementById('coin-total').textContent = meta.coins;
  document.getElementById('shop-coin-total').textContent = meta.coins;
  document.getElementById('lvl-hp').textContent = meta.hpLvl;
  document.getElementById('lvl-spd').textContent = meta.spdLvl;
  document.getElementById('buy-hp').textContent = `Costo: ${100 + meta.hpLvl*50}`;
  document.getElementById('buy-hp').disabled = meta.coins < (100 + meta.hpLvl*50);
  document.getElementById('buy-spd').textContent = `Costo: ${150 + meta.spdLvl*100}`;
  document.getElementById('buy-spd').disabled = meta.coins < (150 + meta.spdLvl*100);
}
function buyUpgrade(type) {
  if(type === 'hp' && meta.coins >= 100 + meta.hpLvl*50) { meta.coins -= 100 + meta.hpLvl*50; meta.hpLvl++; saveMeta(); } 
  else if(type === 'spd' && meta.coins >= 150 + meta.spdLvl*100) { meta.coins -= 150 + meta.spdLvl*100; meta.spdLvl++; saveMeta(); }
}
function toggleShop() { document.getElementById('start-screen').classList.toggle('show'); document.getElementById('shop-screen').classList.toggle('show'); }

const characters = [
  { name: '骑士', emoji: '🛡️', hp: 220, speed: 4.0, startWeapon: 'sword', desc: 'Spada<br>220 HP' },
  { name: '游侠', emoji: '🏹', hp: 130, speed: 5.3, startWeapon: 'bow', desc: 'Arco<br>130 HP' },
  { name: '法师', emoji: '🧙', hp: 140, speed: 4.6, startWeapon: 'book', desc: 'Libro<br>140 HP' },
  { name: '刺客', emoji: '🥷', hp: 110, speed: 6.2, startWeapon: 'dagger', desc: 'Pugnale<br>110 HP' },
  { name: '炼金术士', emoji: '🧪', hp: 150, speed: 4.6, startWeapon: 'potion', desc: 'Pozione<br>150 HP' },
  { name: '精灵', emoji: '🧝', hp: 130, speed: 5.5, startWeapon: 'bow', desc: 'Arco<br>130 HP' },
  { name: 'Principessa', emoji: '👸', hp: 165, speed: 5.0, startWeapon: 'orb', desc: 'Sfera<br>165 HP' },
  { name: 'Steve', emoji: '⛏️', hp: 180, speed: 4.5, startWeapon: 'tnt', desc: 'TNT<br>180 HP' },
  { name: 'Venom', emoji: '🦠', hp: 190, speed: 4.8, startWeapon: 'symbiote', desc: 'Simbiota<br>190 HP' },
  { name: 'Spider-Man', emoji: '🕷️', hp: 140, speed: 6.0, startWeapon: 'web', desc: 'Ragnatela<br>140 HP' },
  { name: 'Mago Spiriti', emoji: '👻', hp: 150, speed: 4.5, startWeapon: 'spirit', desc: 'Spirito<br>150 HP' },
  { name: 'Iron Man', emoji: '🤖', hp: 150, speed: 5.0, startWeapon: 'raygun', desc: 'Ray Gun<br>150 HP' },
  { name: 'Hulk', emoji: '🦍', hp: 260, speed: 3.5, startWeapon: 'fire', desc: 'Aura Fuoco<br>260 HP' },
  { name: 'Omnitrix', emoji: '⌚', hp: 160, speed: 5.2, startWeapon: 'fist', isOmnitrix: true, desc: '17 Forme<br>160 HP' },
  { name: 'Harry', emoji: '🪄', hp: 140, speed: 5.0, startWeapon: 'wand', isHarry: true, desc: 'Magia<br>140 HP' }
];

let currentMode = 1, currentGameMode = 'endless', currentDifficulty = 'normal', p1CharIndex = 0, p2CharIndex = 1, selectingPlayer = 1;
const diffSettings = {
  easy: { hp: 0.8, dmg: 0.8, spd: 0.9, xp: 0.8, boss: 0.02 },
  normal: { hp: 1.0, dmg: 1.0, spd: 1.0, xp: 1.0, boss: 0.04 },
  hard: { hp: 1.3, dmg: 1.2, spd: 1.1, xp: 1.3, boss: 0.08 },
  extreme: { hp: 1.8, dmg: 1.5, spd: 1.3, xp: 1.8, boss: 0.15 }
};

const omniForms = [
  { name: 'Ben', emoji: '⌚', hpMult: 1.0, spdMult: 1.0, weapon: 'fist' }, { name: 'Heatblast', emoji: '🔥', hpMult: 1.2, spdMult: 0.9, weapon: 'fire' },
  { name: 'XLR8', emoji: '⚡', hpMult: 0.8, spdMult: 1.6, weapon: 'dagger' }, { name: 'Four Arms', emoji: '💪', hpMult: 1.5, spdMult: 0.8, weapon: 'sword' },
  { name: 'Diamondhead', emoji: '💎', hpMult: 1.3, spdMult: 1.0, weapon: 'pistol' }, { name: 'Ghostfreak', emoji: '👻', hpMult: 1.1, spdMult: 1.1, weapon: 'spirit' },

function cycleOmnitrix(plIndex) {
  const pl = plIndex === 1 ? p1 : p2;
  if (!pl || !pl.isOmnitrix || pl.unlockedForms <= 1 || pl.hp <= 0) return;
  pl.currentFormIndex = (pl.currentFormIndex + 1) % pl.unlockedForms;
  const form = omniForms[pl.currentFormIndex];
  if (!form) return;
  pl.emoji = form.emoji; pl.maxHp = Math.floor(pl.baseHp * form.hpMult); pl.hp = Math.min(pl.hp, pl.maxHp); pl.speed = pl.baseSpeed * form.spdMult;
  
  const allFormWeapons = omniForms.map(f => f.weapon);
  pl.weapons = pl.weapons.filter(w => !allFormWeapons.includes(w.id));
  let newW = JSON.parse(JSON.stringify(weaponTypes[form.weapon]));
  newW.level = Math.min(10, Math.ceil(pl.level / 2));
  pl.weapons.unshift(newW);
  
  updateInventory(); playSound(800, 'square', 0.2, 0.1, 400);
}

  zone.addEventListener('touchstart', e => { e.preventDefault(); active = true; const t = e.touches[0]; start = { x: t.clientX, y: t.clientY }; base.style.display = 'block'; base.style.left = t.clientX + 'px'; base.style.top = t.clientY + 'px'; stick.style.display = 'block'; stick.style.left = t.clientX + 'px'; stick.style.top = t.clientY + 'px'; }, { passive: false });
  zone.addEventListener('touchmove', e => { e.preventDefault(); if (!active) return; const t = e.touches[0]; let dx = t.clientX - start.x, dy = t.clientY - start.y; const d = Math.sqrt(dx*dx + dy*dy), maxD = 50; if (d > maxD) { dx = (dx/d) * maxD; dy = (dy/d) * maxD; } stick.style.left = (start.x + dx) + 'px'; stick.style.top = (start.y + dy) + 'px'; vectorObj.x = dx / maxD; vectorObj.y = dy / maxD; }, { passive: false });
  zone.addEventListener('touchend', e => { e.preventDefault(); active = false; vectorObj.x = 0; vectorObj.y = 0; base.style.display = 'none'; stick.style.display = 'none'; }, { passive: false });
}

}

function resolveWallCollision(entity) {
  const r = entity.radius;
  for (const w of walls) {
    const cx = Math.max(w.x, Math.min(entity.x, w.x + w.w)), cy = Math.max(w.y, Math.min(entity.y, w.y + w.h));
    const dx = entity.x - cx, dy = entity.y - cy, dSq = dx*dx + dy*dy;
    if (dSq < r*r) {
      const d = Math.sqrt(dSq) || 0.001, overlap = r - d;
      if (dSq < 0.01) {
        const min = Math.min(entity.x - w.x, (w.x + w.w) - entity.x, entity.y - w.y, (w.y + w.h) - entity.y);
        if (min === entity.x - w.x) entity.x = w.x - r; else if (min === (w.x + w.w) - entity.x) entity.x = w.x + w.w + r;
        else if (min === entity.y - w.y) entity.y = w.y - r; else entity.y = w.y + w.h + r;
      } else { entity.x += (dx/d) * overlap; entity.y += (dy/d) * overlap; }
    }
  }
}

  if (p1) { p1.x = -60; p1.y = 0; } if (p2) { p2.x = 60; p2.y = 0; }
  enemies = []; floorEnemiesRemaining = f % 5 === 0 ? 1 : 6 + f*2;
  if (f % 5 === 0) { const boss = spawnEnemy(0, -200); boss.hp = 1000 + f*200; boss.maxHp = boss.hp; boss.type='boss'; boss.emoji='😈'; boss.radius=30; boss.dmg=25; }
  else for (let i = 0; i < floorEnemiesRemaining; i++) spawnEnemy((Math.random()-0.5)*600, (Math.random()-0.5)*400);
}

function spawnEnemy(x, y) {
  const diff = diffSettings[currentDifficulty];
  if (!x && !y) { const a = Math.random()*Math.PI*2, d = Math.max(W,H)*0.7; const c = getAliveCenter(); x = c.x + Math.cos(a)*d; y = c.y + Math.sin(a)*d; }
  const isBoss = gameTime > 30 && Math.random() < diff.boss;
  let e = { x, y, hp: (20 + gameTime)*diff.hp, maxHp: (20 + gameTime)*diff.hp, speed: 1.2*diff.spd, radius: 14, dmg: 10*diff.dmg, xp: 2, emoji: '👾', type: 'melee', shootTimer: 0, slowTimer: 0 };
  if (isBoss) { e.hp = (800 + gameTime*10)*diff.hp; e.maxHp = e.hp; e.radius = 30; e.dmg = 25*diff.dmg; e.emoji = '😈'; e.type = 'boss'; }
  enemies.push(e); return e;
}

function getAliveCenter() {
  let cx = 0, cy = 0, n = 0;

  if (p2 && p2.hp > 0) { cx += p2.x; cy += p2.y; n++; }
  return n === 0 ? { x: 0, y: 0 } : { x: cx/n, y: cy/n };
}

function updateWeapons(pl, dt) {
  if (!pl || pl.hp <= 0) return;
  
  if (pl.isHarry) {
    if (pl.shieldCd > 0) pl.shieldCd -= dt;
    if (pl.shieldActive > 0) pl.shieldActive -= dt;
    if (pl.invisTimer > 0) { pl.invisTimer -= dt; pl.invuln = Math.max(pl.invuln, 0.1); }
    else if (pl.hp < pl.maxHp * 0.3 && pl.passiveTimer <= 0) { 
        pl.invisTimer = 3; pl.passiveTimer = 15; pl.hp += 50; if(pl.hp>pl.maxHp)pl.hp=pl.maxHp; 
        document.getElementById('vignette').style.boxShadow = 'inset 0 0 80px rgba(255, 255, 255, 0.5)'; setTimeout(()=>document.getElementById('vignette').style.boxShadow = 'inset 0 0 80px rgba(231, 111, 81, 0)', 500);
    }
    if (pl.passiveTimer > 0) pl.passiveTimer -= dt;
    
    pl.omniTimer -= dt;
    if (pl.omniTimer <= 0) { pl.omniTimer = 10; minions.push({ x: pl.x, y: pl.y, owner: pl, isPatronus: true, cdTimer: 0, emoji: '🦌', isKing: false }); }
  }

  if (pl.isOmnitrix) {
    if (pl.currentFormIndex === 11) pl.hp = Math.min(pl.maxHp, pl.hp + 1 * dt);
    if (pl.currentFormIndex === 16) enemies.forEach(e => { if(Math.hypot(e.x-pl.x, e.y-pl.y) < 150) e.slowTimer = 0.5; });
    
    if (pl.currentFormIndex === 15) {
        pl.passiveTimer -= dt;
        if (pl.passiveTimer <= 0) {
            pl.passiveTimer = 10;
            enemies.forEach(e => { if (e.hp > 0) { e.hp -= 200; e.hitTimer = 0.2; spawnParticles(e.x, e.y, '#ff1493', 5); } });
            camera.shake = 20; playSound(100, 'sawtooth', 1, 0.2, -50);
            document.getElementById('vignette').style.boxShadow = 'inset 0 0 200px rgba(255, 20, 147, 0.8)'; setTimeout(()=>document.getElementById('vignette').style.boxShadow = 'inset 0 0 80px rgba(231, 111, 81, 0)', 500);
        }
    }
  }

  pl.weapons.forEach(w => {
    w.cdTimer -= dt;
    if (w.cdTimer > 0) return;

    let nearest = null, minDist = Infinity;
    enemies.forEach(e => { const d = Math.hypot(e.x - pl.x, e.y - pl.y); if (d < minDist) { minDist = d; nearest = e; } });
    if (!nearest && w.id !== 'fire' && w.id !== 'orb' && w.id !== 'raygun') return;
    const angle = nearest ? Math.atan2(nearest.y - pl.y, nearest.x - pl.x) : 0;

    if (w.id === 'fist') { projectiles.push({ x: pl.x, y: pl.y, vx: Math.cos(angle)*15, vy: Math.sin(angle)*15, damage: 15+w.level*5, life: 0.2, emoji: '💥', color: '#fff', radius: 15, hitList: [] }); w.cdTimer = w.cd; }
    if (w.id === 'sword') { if (minDist < 120) { nearest.hp -= 20+w.level*10; nearest.hitTimer = 0.1; spawnParticles(nearest.x, nearest.y, '#4cc9f0', 3); } w.cdTimer = w.cd; }
    if (w.id === 'bow') { for(let i=-1;i<=1;i++) projectiles.push({ x: pl.x, y: pl.y, vx: Math.cos(angle+i*0.1)*20, vy: Math.sin(angle+i*0.1)*20, damage: 15+w.level*5, life: 1.5, emoji: '➡️', color: '#2ecc71', radius: 5, hitList: [] }); w.cdTimer = w.cd; }
    if (w.id === 'dagger') { projectiles.push({ x: pl.x, y: pl.y, vx: Math.cos(angle)*30, vy: Math.sin(angle)*30, damage: 10+w.level*5, life: 0.5, emoji: '🗡️', color: '#e63946', radius: 5, hitList: [] }); w.cdTimer = w.cd; }
    if (w.id === 'potion') { projectiles.push({ x: pl.x, y: pl.y, vx: Math.cos(angle)*12, vy: Math.sin(angle)*12, damage: 5, life: 0.8, emoji: '🧪', isPotion: true, potionLevel: w.level, owner: pl, radius: 8, hitList: [] }); w.cdTimer = w.cd; }
    if (w.id === 'tnt') { let vx = pl.facingX, vy = pl.facingY; if(vx===0&&vy===0){vx=Math.cos(angle);vy=Math.sin(angle);} projectiles.push({ x: pl.x, y: pl.y, vx: vx*15, vy: vy*15, damage: 40+w.level*20, life: 1.5, emoji: '💣', isTNT: true, blastRadius: 100, owner: pl, radius: 10, hitList: [] }); w.cdTimer = w.cd; }
    if (w.id === 'pistol') { if (pl.currentFormIndex === 4) { for(let i=0;i<2;i++) projectiles.push({ x: pl.x, y: pl.y, vx: Math.cos(angle+i*0.2)*20, vy: Math.sin(angle+i*0.2)*20, damage: 10+w.level*5, life: 1.5, emoji: '⚪', bounce: true, bouncesLeft: 2, radius: 6, hitList: [] }); } else projectiles.push({ x: pl.x, y: pl.y, vx: Math.cos(angle)*20, vy: Math.sin(angle)*20, damage: 10+w.level*5, life: 1.5, emoji: '⚪', radius: 6, hitList: [] }); w.cdTimer = w.cd; }
    if (w.id === 'book') { for(let i=0;i<8;i++) projectiles.push({ x: pl.x, y: pl.y, vx: Math.cos(i/8*Math.PI*2)*12, vy: Math.sin(i/8*Math.PI*2)*12, damage: 5+w.level*4, life: 2, emoji: '🔮', radius: 6, hitList: [], pierce: true }); w.cdTimer = w.cd; }
    if (w.id === 'fire') { const r = 50 + w.level*20; enemies.forEach(e => { if(Math.hypot(e.x-pl.x, e.y-pl.y) < r) { e.hp -= (10+w.level*5)*dt*3; e.hitTimer = 0.1; } }); w.cdTimer = 0.1; }
    if (w.id === 'web') { projectiles.push({ x: pl.x, y: pl.y, vx: Math.cos(angle)*15, vy: Math.sin(angle)*15, damage: 15, life: 1.5, emoji: '🕸️', radius: 8, hitList: [], slow: true, freeze: pl.currentFormIndex === 14 }); w.cdTimer = w.cd; }
    if (w.id === 'symbiote') { projectiles.push({ x: pl.x, y: pl.y, vx: Math.cos(angle)*22, vy: Math.sin(angle)*22, damage: 25, life: 1.0, emoji: '⚫', radius: 10, lifesteal: true, owner: pl, hitList: [] }); w.cdTimer = w.cd; }
    if (w.id === 'spirit') { if(minions.filter(m=>m.owner===pl).length < w.level) minions.push({ x: pl.x, y: pl.y, cdTimer: 0, isKing: false, owner: pl, emoji: '👻' }); w.cdTimer = w.cd; }
    if (w.id === 'lightning') { for(let i=0;i<2;i++){ const e = enemies[Math.floor(Math.random()*enemies.length)]; if(e){ e.hp -= 30; e.hitTimer = 0.1; spawnParticles(e.x,e.y,'#e9c46a',3); } } w.cdTimer = w.cd; }
    if (w.id === 'raygun') {
      const rays = 1 + Math.floor(w.level/2) + (pl.currentFormIndex===15?4:0);
      for (let r = 0; r < rays; r++) {
        const a = (Date.now()/1000) + (r*Math.PI*2/rays);
        enemies.forEach(e => { const d = Math.hypot(e.x-pl.x, e.y-pl.y); if(d<200){ const da = Math.atan2(e.y-pl.y, e.x-pl.x); if(Math.abs(Math.atan2(Math.sin(a-da), Math.cos(a-da))) < 0.2 && !e.rayTimer) { e.hp -= 10+w.level*5; e.hitTimer = 0.1; e.rayTimer = 0.2; } } });
      }
    }
    if (w.id === 'orb') { 
      const r = 90 + w.level*5;
      for(let i=0;i<4+w.level;i++) { const a = (Date.now()/400)+(i*Math.PI*2/(4+w.level)); const ox=pl.x+Math.cos(a)*r, oy=pl.y+Math.sin(a)*r; enemies.forEach(e => { if(Math.hypot(e.x-ox, e.y-oy) < e.radius+14 && !e.orbTimer) { e.hp -= 8+w.level*4; e.hitTimer=0.1; e.orbTimer=0.25; } }); }
    }
    if (w.id === 'wand') { 
        if(pl.currentFormIndex===13) projectiles.push({ x: pl.x, y: pl.y, vx: Math.cos(angle)*25, vy: Math.sin(angle)*25, damage: 40, life: 2, emoji: '💀', radius: 8, pierce: true, hitList: [] });
        else projectiles.push({ x: pl.x, y: pl.y, vx: Math.cos(angle)*20, vy: Math.sin(angle)*20, damage: 18+w.level*8, life: 1.5, emoji: '✨', radius: 6, hitList: [] }); 
        w.cdTimer = w.cd; 
    }
  });
}

function update(dt) {
  if (isGameOver || isLevelUp || isChestOpen || !isStarted || isPaused) return;
  gameTime += dt;
  if (Math.floor(gameTime) > recordTime) { recordTime = Math.floor(gameTime); safeStorage.setItem('neon_record', recordTime); }
  
  // FIX: UI Update del timer e delle barre
  uiUpdateTimer -= dt;
  if(uiUpdateTimer <= 0) {
      const mins = Math.floor(gameTime / 60).toString().padStart(2, '0');
      const secs = Math.floor(gameTime % 60).toString().padStart(2, '0');
      document.getElementById('timer').textContent = `${mins}:${secs}`;
      document.getElementById('hp-bar').style.width = Math.max(0, (p1.hp / p1.maxHp) * 100) + '%';
      if (p2) document.getElementById('hp-bar-p2').style.width = Math.max(0, (p2.hp / p2.maxHp) * 100) + '%';
      document.getElementById('xp-bar').style.width = Math.min(100, (p1.xp / p1.xpNext) * 100) + '%';
      uiUpdateTimer = 0.25;
  }

  [p1, p2].forEach(pl => {
    if (pl && pl.isOmnitrix && pl.hp > 0) {
      pl.omniTimer += dt;
      if (pl.omniTimer > 10 && pl.unlockedForms < omniForms.length) {
        pl.omniTimer = 0; pl.unlockedForms++;
        document.getElementById('vignette').style.boxShadow = 'inset 0 0 100px rgba(0, 255, 0, 0.6)'; setTimeout(()=>document.getElementById('vignette').style.boxShadow = 'inset 0 0 80px rgba(231, 111, 81, 0)', 200);
      }
    }
  });

  if (camera.shake > 0) camera.shake -= dt * 50;
  
  [p1, p2].forEach((pl, idx) => {
    if (!pl || pl.hp <= 0) return;
    if (pl.dashCd > 0) pl.dashCd -= dt;
    if (pl.isDashing) { pl.dashTimer -= dt; if (pl.dashTimer <= 0) pl.isDashing = false; }
    let vx = idx === 0 ? p1Vector.x : p2Vector.x, vy = idx === 0 ? p1Vector.y : p2Vector.y;
    const len = Math.sqrt(vx*vx + vy*vy);
    if (len > 0) { pl.facingX = vx/len; pl.facingY = vy/len; }
    if (pl.isDashing) { pl.x += pl.dashDir.x * pl.speed * 3 * dt * 60; pl.y += pl.dashDir.y * pl.speed * 3 * dt * 60; }
    else if (len > 0) { pl.x += (vx/len) * pl.speed * dt * 60; pl.y += (vy/len) * pl.speed * dt * 60; }
    if (pl.invuln > 0) pl.invuln -= dt;
    resolveWallCollision(pl);
  });

  const c = getAliveCenter();
  camera.x = c.x - W/2 + (Math.random()-0.5)*camera.shake;
  camera.y = c.y - H/2 + (Math.random()-0.5)*camera.shake;

  if (currentGameMode === 'endless' && Math.random() < dt * (2 + gameTime * 0.1)) spawnEnemy();

  minions.forEach(m => {
    m.cdTimer -= dt;
    const owner = m.owner && m.owner.hp > 0 ? m.owner : p1;
    if (owner) {
      const d = Math.hypot(owner.x - m.x, owner.y - m.y);
      if (d > 150) { m.x += (owner.x - m.x)/d * 6; m.y += (owner.y - m.y)/d * 6; }
    }
    if (m.cdTimer <= 0) {
      let nearest = null, minD = 400;
      enemies.forEach(e => { const d = Math.hypot(e.x-m.x, e.y-m.y); if(d<minD){minD=d;nearest=e;} });
      if (nearest) {
        const a = Math.atan2(nearest.y-m.y, nearest.x-m.x);
        projectiles.push({ x: m.x, y: m.y, vx: Math.cos(a)*15, vy: Math.sin(a)*15, damage: m.isPatronus?80:30, life: 1.5, emoji: m.isPatronus?'✨':'👻', color: m.isPatronus?'#fff':'#2a9d8f', radius: 8, hitList: [], pierce: m.isPatronus });
        m.cdTimer = 1.0;
      }
    }
  });

  updateWeapons(p1, dt); if (p2) updateWeapons(p2, dt);
  enemies.forEach(e => { if (e.rayTimer) e.rayTimer -= dt; if (e.orbTimer) e.orbTimer -= dt; });

  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    if (p.isTNT) {
      p.x += p.vx * dt * 60; p.y += p.vy * dt * 60; p.life -= dt;
      let hit = false;
      if(walls.some(w => p.x>w.x-10 && p.x<w.x+w.w+10 && p.y>w.y-10 && p.y<w.y+w.h+10)) hit = true;
      if(enemies.some(e => Math.hypot(e.x-p.x, e.y-p.y) < e.radius+10)) hit = true;
      if (hit || p.life <= 0) {
        enemies.forEach(e => { if(Math.hypot(e.x-p.x, e.y-p.y) < p.blastRadius) { e.hp -= p.damage; e.hitTimer = 0.2; } });
        spawnParticles(p.x, p.y, '#ff6600', 15); camera.shake = 15; playSound(200, 'sawtooth', 0.4, 0.1, -100);
        projectiles.splice(i, 1); continue;
      }
      continue;
    }
    if (p.isPotion) {
      p.x += p.vx * dt * 60; p.y += p.vy * dt * 60; p.vx *= 0.94; p.vy *= 0.94; p.life -= dt;
      if (p.life <= 0) {
        potionClouds.push({ x: p.x, y: p.y, radius: 40 + p.potionLevel*5 + (p.owner.isOmnitrix&&p.owner.currentFormIndex===8?40:0), life: 3, owner: p.owner, damage: 10, tickTimer: 0 });
        projectiles.splice(i, 1); continue;
      }
      continue;
    }

    p.x += p.vx * dt * 60; p.y += p.vy * dt * 60; p.life -= dt;
    let hit = false;
    for (let e of enemies) {
      if (e.hp > 0 && p.hitList && !p.hitList.includes(e) && Math.hypot(e.x-p.x, e.y-p.y) < e.radius + p.radius) {
        let dmg = p.damage;
        if (p.owner && p.owner.isOmnitrix && p.owner.currentFormIndex === 9 && e.hp < e.maxHp*0.3) dmg *= 2;
        e.hp -= dmg; e.hitTimer = 0.1; spawnParticles(p.x, p.y, p.color, 2);
        if (p.slow) { if (p.freeze) e.slowTimer = 100; else e.slowTimer = 2; }
        if (p.lifesteal && p.owner) p.owner.hp = Math.min(p.owner.maxHp, p.owner.hp + 2);
        if(p.hitList) p.hitList.push(e);
        
        if (p.pierce) { } 
        else if (p.bounce && p.bouncesLeft > 0) {
          let next = null, minD = 90000;
          enemies.forEach(o => { if(o!==e && o.hp>0 && p.hitList && !p.hitList.includes(o)) { const d = Math.hypot(o.x-p.x, o.y-p.y); if(d<minD){minD=d;next=o;} } });
          if (next) { const a = Math.atan2(next.y-p.y, next.x-p.x); p.vx = Math.cos(a)*20; p.vy = Math.sin(a)*20; p.bouncesLeft--; p.life=1.5; } else hit = true;
        } else hit = true;
        break;
      }
    }
    if (hit || p.life <= 0) projectiles.splice(i, 1);
  }

  for (let i = potionClouds.length - 1; i >= 0; i--) {
    const c = potionClouds[i]; c.life -= dt; c.tickTimer -= dt;
    if (c.tickTimer <= 0) { c.tickTimer = 0.5; enemies.forEach(e => { if(Math.hypot(e.x-c.x, e.y-c.y) < c.radius) { e.hp -= c.damage; e.hitTimer = 0.1; } }); }
    if (c.life <= 0) potionClouds.splice(i, 1);
  }

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.hitTimer) e.hitTimer -= dt; if (e.slowTimer > 0) e.slowTimer -= dt;
    
    if (e.hp <= 0) {
      const xpMult = (p1.isOmnitrix&&p1.currentFormIndex===10?1.5:1);
      orbs.push({ x: e.x, y: e.y, value: e.xp * xpMult, radius: 4 });
      if (e.type === 'boss') { chests.push({ x: e.x, y: e.y, radius: 20 }); camera.shake = 10; if(p1)p1.hp+=50; if(p2)p2.hp+=50; }
      if (p1) p1.killCount++; if (p2) p2.killCount++;
      if (currentGameMode === 'tower') { floorEnemiesRemaining--; if (floorEnemiesRemaining <= 0) portal = { x: 0, y: 0, radius: 40, phase: 0 }; }
      enemies.splice(i, 1); continue;
    }
    
    let target = p1;
    if (p1.invisTimer > 0 && p2 && p2.hp > 0) target = p2;
    if (p1.hp <= 0 && p2) target = p2;
    if (p2 && p2.hp > 0 && p2.invisTimer <= 0 && Math.hypot(p2.x-e.x, p2.y-e.y) < Math.hypot(p1.x-e.x, p1.y-e.y) && p1.invisTimer<=0) target = p2;

    const angle = Math.atan2(target.y - e.y, target.x - e.x);
    const spd = e.speed * (e.slowTimer > 0 ? 0.4 : 1) * dt * 60;
    e.x += Math.cos(angle) * spd; e.y += Math.sin(angle) * spd;
    
    if (Math.hypot(e.x-target.x, e.y-target.y) < e.radius + target.radius && target.invuln <= 0 && target.invisTimer <= 0) {
      if(target.isOmnitrix && target.currentFormIndex === 5) { } 
      else {
        target.hp -= e.dmg; target.invuln = 1.5; camera.shake = 5;
        document.getElementById('vignette').style.boxShadow = 'inset 0 0 80px rgba(231, 111, 81, 0.6)'; setTimeout(()=>document.getElementById('vignette').style.boxShadow = 'inset 0 0 80px rgba(231, 111, 81, 0)', 200);
      }
    }
  }

  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const b = enemyBullets[i]; b.x += b.vx * dt * 60; b.y += b.vy * dt * 60; b.life -= dt;
    [p1, p2].forEach(pl => {
      if (pl && pl.hp > 0 && pl.invuln <= 0 && pl.invisTimer <= 0 && Math.hypot(pl.x - b.x, pl.y - b.y) < pl.radius + b.radius) {
        if (pl.isHarry && pl.shieldActive > 0) {
          enemyBullets.push({ x: pl.x, y: pl.y, vx: -b.vx*1.5, vy: -b.vy*1.5, radius: 10, damage: b.damage*2, life: 3, color: '#ffd700', emoji: '🛡️' });
          spawnParticles(pl.x, pl.y, '#ffd700', 10); camera.shake = 5;
        } else if (pl.isOmnitrix && pl.currentFormIndex === 13) { pl.hp -= b.damage*0.5; }
        else { pl.hp -= b.damage; pl.invuln = 1.5; }
        enemyBullets.splice(i, 1);
      }
    });
  }

  const alive = [p1, p2].filter(p => p && p.hp > 0);
  for (let i = orbs.length - 1; i >= 0; i--) {
    const o = orbs[i]; let best = null, bestSq = Infinity;
    alive.forEach(p => { const d = (p.x-o.x)**2 + (p.y-o.y)**2; if (d < bestSq) { bestSq = d; best = p; } });
    if (best) {
      if (bestSq < best.magnetRange**2) { const a = Math.atan2(best.y-o.y, best.x-o.x); o.x += Math.cos(a)*15*dt*60; o.y += Math.sin(a)*15*dt*60; }
      if (bestSq < (best.radius+4)**2) { p1.xp += o.value; if(p2)p2.xp += o.value; orbs.splice(i,1); if(p1.xp >= p1.xpNext) triggerLevelUp(); }
    }
  }
  
  for (let i = chests.length - 1; i >= 0; i--) {
    const ch = chests[i]; let collected = false;
    for (const pl of alive) { if (Math.hypot(pl.x - ch.x, pl.y - ch.y) < (pl.radius + ch.radius)) { collected = true; break; } }
    if (collected) { chests.splice(i, 1); openChest(); }
  }

  if (portal) {
    portal.phase += dt*2;
    if (alive.some(p => Math.hypot(p.x, p.y) < 40)) { currentFloor++; generateFloor(currentFloor); }
  }
  for (let i = particles.length - 1; i >= 0; i--) { particles[i].life -= dt; if (particles[i].life <= 0) particles.splice(i,1); }

  if (p1.hp <= 0 && (!p2 || p2.hp <= 0)) {
    isGameOver = true; document.body.className = isTouchDevice ? 'touch-device' : ''; playSound(100, 'sawtooth', 1, 0.1, -50);
    meta.coins += Math.floor(gameTime/5) + p1.killCount*2; saveMeta();
    document.getElementById('go-time').innerText = Math.floor(gameTime); document.getElementById('go-coins').innerText = Math.floor(gameTime/5)+p1.killCount*2;
    document.getElementById('gameover-screen').classList.add('show');
  }
}

function generateChoices() {
  let choices = []; let allWeapons = [];
  p1.weapons.forEach(w => { if(w.id !== 'fist') allWeapons.push(w); });
  if (p2) p2.weapons.forEach(w => { if (w.id !== 'fist' && !allWeapons.find(aw => aw.id === w.id)) allWeapons.push(w); });

  Object.values(weaponTypes).forEach(wt => { 
    if (wt.id !== 'fist' && !allWeapons.find(w => w.id === wt.id) && !banishedChoices.includes(wt.id)) choices.push({ id: wt.id + '_new', type: 'new', data: { ...wt, level: 1 } }); 
  });

  allWeapons.forEach(w => { if (w.level < w.maxLevel && !banishedChoices.includes(w.id + '_up')) choices.push({ id: w.id + '_up', type: 'upgrade', data: w }); });
  allWeapons.forEach(w => { if (w.level >= w.maxLevel && !w.evolved && !banishedChoices.includes(w.id + '_evo')) choices.push({ id: w.id + '_evo', type: 'evo', data: w }); });

  choices.push({ id: 'stat_speed', type: 'stat', data: { name: 'Scarpe', desc: 'Velocità +10%', stat: 'speed' } });
  choices.push({ id: 'stat_hp', type: 'stat', data: { name: 'Mela', desc: 'Cura 50 HP', stat: 'hp' } });
  choices.push({ id: 'stat_magnet', type: 'stat', data: { name: 'Calamita', desc: 'Raggio XP +30', stat: 'magnet' } });
  choices.push({ id: 'stat_armor', type: 'stat', data: { name: 'Corazza', desc: 'Danno -15%', stat: 'armor' } });
  
  choices = choices.filter(c => !banishedChoices.includes(c.id));
  choices.sort(() => Math.random() - 0.5);
  return choices.slice(0, 3);
}

function triggerLevelUp() {
  isLevelUp = true; p1.level++; p1.xp -= p1.xpNext; 
  p1.xpNext = Math.floor(p1.xpNext * 1.4 * (diffSettings[currentDifficulty].xp || 1.0));
  if (p2) { p2.level = p1.level; p2.xpNext = p1.xpNext; p2.xp = p1.xp; }
  playSound(600, 'sine', 0.2, 0.05, 200);
  currentChoices = generateChoices(); updateRerollUI(); showChoices(currentChoices, 'levelup');
}

function openChest() {
  isChestOpen = true; playSound(800, 'sine', 0.5, 0.05, 200);
  let choices = []; let allWeapons = [];
  p1.weapons.forEach(w => { if(w.id !== 'fist') allWeapons.push(w); });
  if (p2) p2.weapons.forEach(w => { if (w.id !== 'fist' && !allWeapons.find(aw => aw.id === w.id)) allWeapons.push(w); });
  allWeapons.forEach(w => { if (w.level >= w.maxLevel && !w.evolved) choices.push({ id: w.id + '_evo', type: 'evo', data: w }); });
  
  if (choices.length === 0) choices = generateChoices(); else { choices.sort(() => Math.random() - 0.5); if(choices.length > 3) choices = choices.slice(0, 3); }
  currentChoices = choices; updateRerollUI(); showChoices(currentChoices, 'chest-screen');
}

function updateRerollUI() {
  if(document.getElementById('btn-reroll')) { document.getElementById('btn-reroll').innerHTML = `REROLL (${meta.rerolls})`; document.getElementById('btn-reroll').disabled = meta.rerolls <= 0; }
  if(document.getElementById('btn-reroll-chest')) { document.getElementById('btn-reroll-chest').innerHTML = `REROLL (${meta.rerolls})`; document.getElementById('btn-reroll-chest').disabled = meta.rerolls <= 0; }
}
function rerollChoices(screenId) {
  if (meta.rerolls > 0) { meta.rerolls--; currentChoices = generateChoices(); updateRerollUI(); showChoices(currentChoices, screenId); }
}
function banishChoice(screenId) {
  if (currentChoices.length > 0) { banishedChoices.push(currentChoices[0].id); currentChoices = generateChoices(); updateRerollUI(); showChoices(currentChoices, screenId); }
}

function showChoices(options, screenId) {
  const container = document.getElementById(screenId === 'levelup' ? 'upgrade-options' : 'chest-options');
  container.innerHTML = '';
  options.forEach((opt) => {
    const card = document.createElement('div');
    card.className = 'upgrade-card' + (opt.type === 'evo' ? ' evo' : '');
    let title, desc;
    if (opt.type === 'new') { title = `NUOVO: ${opt.data.name}`; desc = opt.data.desc; }
    else if (opt.type === 'upgrade') { title = `${opt.data.name} Lv.${opt.data.level + 1}`; desc = "Aumenta potenza."; }
    else if (opt.type === 'evo') { title = `🌟 EVO: ${opt.data.name}`; desc = "Trasformazione."; }
    else { title = opt.data.name; desc = opt.data.desc; }
    card.innerHTML = `<h3>${title}</h3><p>${desc}</p>`;
    card.onclick = () => {
      applyUpgrade(opt);
      document.getElementById(screenId).classList.remove('show');
      if(screenId === 'levelup') isLevelUp = false; else isChestOpen = false;
      playSound(500, 'square', 0.1, 0.05);
    };
    container.appendChild(card);
  });
  document.getElementById(screenId).classList.add('show');
}

function applyUpgrade(opt) {
  const targetLevel = opt.type === 'upgrade' ? Math.min(opt.data.level + 1, opt.data.maxLevel) : 0;
  [p1, p2].forEach(pl => {
    if (!pl) return;
    if (opt.type === 'new') { if (!pl.weapons.find(w => w.id === opt.data.id)) pl.weapons.push(JSON.parse(JSON.stringify(opt.data))); }
    else if (opt.type === 'upgrade') { 
      let w = pl.weapons.find(w => w.id === opt.data.id);
      if (w) { w.level = Math.max(w.level, targetLevel); w.cd *= 0.92; } 
      else { const nw = JSON.parse(JSON.stringify(opt.data)); nw.level = targetLevel; nw.cd = opt.data.cd * 0.92; pl.weapons.push(nw); }
    }
    else if (opt.type === 'evo') { 
      const w = pl.weapons.find(w => w.id === opt.data.id);
      if (w) { w.evolved = true; w.name = w.id === 'sword' ? 'Spada Divina' : w.name + ' EVO'; }
    }
    else if (opt.type === 'stat') {
      if (opt.data.stat === 'speed') { pl.speed *= 1.1; pl.baseSpeed *= 1.1; }
      if (opt.data.stat === 'hp') { pl.hp = Math.min(pl.maxHp, pl.hp + 50); pl.baseHp += 50; pl.maxHp += 50; }
      if (opt.data.stat === 'magnet') pl.magnetRange += 30;
      if (opt.data.stat === 'armor') pl.armor = Math.min(0.8, (pl.armor||0) + 0.15);
    }
  });
  updateInventory();
}

function draw() {
  ctx.fillStyle = '#1e1e24'; ctx.fillRect(0, 0, W, H);
  ctx.save(); 
  if (isNaN(camera.x) || isNaN(camera.y)) { camera.x = 0; camera.y = 0; } // FIX anti-crash NaN
  ctx.translate(-camera.x, -camera.y);
  
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  for (let x = Math.floor(camera.x/60)*60; x < camera.x+W; x+=60) { ctx.beginPath(); ctx.moveTo(x, camera.y); ctx.lineTo(x, camera.y+H); ctx.stroke(); }
  for (let y = Math.floor(camera.y/60)*60; y < camera.y+H; y+=60) { ctx.beginPath(); ctx.moveTo(camera.x, y); ctx.lineTo(camera.x+W, y); ctx.stroke(); }

  walls.forEach(w => { ctx.fillStyle = '#3a3a44'; ctx.fillRect(w.x, w.y, w.w, w.h); });
  potionClouds.forEach(c => { ctx.fillStyle = 'rgba(62, 207, 224, 0.3)'; ctx.beginPath(); ctx.arc(c.x, c.y, c.radius, 0, Math.PI*2); ctx.fill(); });
  if (portal) { ctx.fillStyle = '#ff66c4'; ctx.beginPath(); ctx.arc(portal.x, portal.y, 30, 0, Math.PI*2); ctx.fill(); }

  orbs.forEach(o => { ctx.fillStyle = '#4cc9f0'; ctx.beginPath(); ctx.arc(o.x, o.y, o.radius, 0, Math.PI*2); ctx.fill(); });
  particles.forEach(p => { ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 3, 3); ctx.globalAlpha = 1; });
  
  minions.forEach(m => drawEmoji(ctx, m.emoji||'👻', m.x, m.y, 30));
  projectiles.forEach(p => {
      if (p.emoji) drawEmoji(ctx, p.emoji, p.x, p.y, p.radius * 2.5);
      else { ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2); ctx.fill(); }
  });
  enemyBullets.forEach(b => drawEmoji(ctx, b.emoji||'🔵', b.x, b.y, b.radius * 2.5));
  
  enemies.forEach(e => {
    drawEmoji(ctx, e.emoji, e.x, e.y, e.radius*2.5);
    if(e.slowTimer > 0) { ctx.fillStyle = 'rgba(136, 204, 255, 0.5)'; ctx.beginPath(); ctx.arc(e.x, e.y, e.radius, 0, Math.PI*2); ctx.fill(); }
    if(e.type==='boss'){ ctx.fillStyle='#e76f51'; ctx.fillRect(e.x-e.radius, e.y-e.radius-15, e.radius*2*(e.hp/e.maxHp), 5); }
  });

  [p1, p2].forEach(pl => {
    if (pl && pl.hp > 0 && !isNaN(pl.x) && !isNaN(pl.y)) {
      if (pl.isHarry && pl.shieldActive > 0) { ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(pl.x, pl.y, pl.radius+12, 0, Math.PI*2); ctx.stroke(); ctx.fillStyle = 'rgba(255, 215, 0, 0.2)'; ctx.beginPath(); ctx.arc(pl.x, pl.y, pl.radius+12, 0, Math.PI*2); ctx.fill(); }
      if (pl.isHarry && pl.invisTimer > 0) ctx.globalAlpha = 0.3;
      if (pl.isOmnitrix && pl.currentFormIndex === 16) { ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.arc(pl.x, pl.y, 150, 0, Math.PI*2); ctx.fill(); }
      
      drawEmoji(ctx, pl.emoji, pl.x, pl.y, 44);
      ctx.globalAlpha = 1;
    }
  });
  ctx.restore();
}

let lastT = 0;
function loop(t) { const dt = Math.min((t-lastT)/1000, 0.1); lastT = t; update(dt); draw(); requestAnimationFrame(loop); }

initCharSelect(); updateSelectingUI(); requestAnimationFrame(loop); updateCoinUI();
</script>
</body>
